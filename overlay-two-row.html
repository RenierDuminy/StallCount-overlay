<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Two-Row Overlay</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700&display=swap");

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%; height: 100%;
        background: transparent;
        overflow: hidden;
      }

      #viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #canvas {
        position: relative;
        width: 1920px;
        height: 1080px;
        transform-origin: top left;
      }

      /* â”€â”€ Two-row (tennis / duel style) â”€â”€ */
      /* Each row: serving dot | player name | sets | game score */

      .tw-root {
        position: absolute;
        bottom: 32px;
        left: 32px;
        font-family: "Space Grotesk", sans-serif;
        min-width: 480px;
        box-shadow: 0 12px 36px rgba(0,0,0,0.55);
        overflow: hidden;
        background: rgba(8,8,8,0.94);
        border: 1px solid rgba(255,255,255,0.06);
      }

      /* #teamABox / #teamBBox receive --team-bg / --team-text from overlay.js.
         Used as a left accent stripe; background stays dark for readability. */
      .tw-row {
        display: grid;
        grid-template-columns: 28px minmax(0,1fr) 64px;
        align-items: stretch;
        height: 56px;
        border-bottom: 1px solid rgba(255,255,255,0.07);
        border-left: 4px solid var(--team-bg, transparent);
        position: relative;
      }

      .tw-break-strip {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 100%;
        padding: 5px 12px;
        background: #dc2626;
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-align: center;
        white-space: normal;
        line-height: 1.15;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.18s ease;
      }

      .tw-break-strip.is-active,
      .tw-break-strip.is-persistent {
        opacity: 1;
      }

      .tw-row:last-of-type {
        border-bottom: 0;
      }

      /* Serve indicator */
      .tw-serve {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.3);
        border-right: 1px solid rgba(255,255,255,0.07);
      }

      .tw-serve__dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #22c55e;
        opacity: 0;
        transition: opacity 0.2s;
      }

      .tw-row.is-serving .tw-serve__dot { opacity: 1; }

      /* Player name */
      .tw-name {
        display: flex;
        align-items: center;
        padding: 0 14px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tw-row.is-serving .tw-name { color: #ffffff; }

      /* Score uses team accent colour from --team-bg */
      .tw-game {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Bebas Neue", sans-serif;
        font-size: 30px;
        letter-spacing: 0.04em;
        color: var(--team-text, #ffffff);
        border-left: 2px solid rgba(255,255,255,0.12);
        padding: 0 8px;
        background: var(--team-bg, rgba(0,0,0,0.3));
      }

      /* Column headers */
      .tw-header {
        display: grid;
        grid-template-columns: 28px minmax(0,1fr) 64px;
        height: 26px;
        background: rgba(0,0,0,0.5);
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }

      .tw-header__cell {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.4);
        border-left: 1px solid rgba(255,255,255,0.06);
      }

      .tw-header__cell:first-child {
        border-left: 0;
      }

      /* ── Player stats banner ── */
      #overlayBanner {
        position: absolute;
        left: 50%;
        bottom: 180px;
        transform: translateX(-50%) translateY(24px);
        opacity: 0;
        pointer-events: none;
        display: flex;
        align-items: stretch;
        overflow: hidden;
        box-shadow: 0 12px 36px rgba(0,0,0,0.55);
        min-width: 560px;
        font-family: "Space Grotesk", sans-serif;
        border: 1px solid rgba(255,255,255,0.07);
        background: rgba(8,8,8,0.94);
      }

      #overlayBanner.is-active {
        animation: tw-banner-rise-hold-fade 6.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      #overlayBanner.is-persistent {
        animation: none;
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @keyframes tw-banner-rise-hold-fade {
        0%   { opacity: 0; transform: translateX(-50%) translateY(24px); }
        12%  { opacity: 1; transform: translateX(-50%) translateY(0); }
        80%  { opacity: 1; transform: translateX(-50%) translateY(0); }
        100% { opacity: 0; transform: translateX(-50%) translateY(0); }
      }

      .tw-banner-team {
        background: var(--banner-team-bg, #1f2933);
        color: var(--banner-team-text, #ffffff);
        display: flex;
        align-items: center;
        padding: 0 20px;
        min-width: 180px;
        border-left: 4px solid var(--banner-team-bg, transparent);
      }

      #bannerPlayerName {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tw-banner-stats {
        display: flex;
        align-items: stretch;
      }

      .tw-banner-stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10px 20px;
        gap: 2px;
        border-left: 1px solid rgba(255,255,255,0.07);
      }

      .tw-banner-stat__label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.4);
      }

      .tw-banner-stat__value {
        font-family: "Bebas Neue", sans-serif;
        font-size: 30px;
        letter-spacing: 0.04em;
        color: var(--banner-team-bg, #ffffff);
        line-height: 1;
      }

      /* ── Match stats banner ── */
      #matchStatsBanner {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) scale(0.97);
        opacity: 0;
        pointer-events: none;
        display: block;
        width: 640px;
        transition: opacity 0.18s ease, transform 0.18s ease;
        font-family: "Space Grotesk", sans-serif;
        z-index: 10;
      }

      #matchStatsBanner.is-active {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      .tw-matchstats-card {
        background: rgba(8,8,8,0.96);
        border: 1px solid rgba(255,255,255,0.07);
        box-shadow: 0 24px 60px rgba(0,0,0,0.6);
        overflow: hidden;
      }

      #matchStatsTitle {
        display: block;
        text-align: center;
        padding: 10px 16px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        background: rgba(0,0,0,0.5);
        color: rgba(255,255,255,0.4);
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }

      .tw-matchstats-body {
        display: grid;
        grid-template-columns: minmax(0,1fr) minmax(0,0.9fr) minmax(0,1fr);
        align-items: stretch;
      }

      .tw-matchstats-col {
        display: grid;
        grid-template-rows: minmax(56px,auto) repeat(4, 44px);
        min-width: 0;
      }

      .tw-matchstats-col--team {
        background: var(--team-bg, #1f2933);
        color: var(--team-text, #ffffff);
        border-left: 4px solid var(--team-bg, transparent);
      }

      .tw-matchstats-col--team > * + * { border-top: 1px solid rgba(255,255,255,0.07); }

      .tw-matchstats-col--metrics {
        background: rgba(0,0,0,0.3);
        color: rgba(255,255,255,0.8);
        border-left: 1px solid rgba(255,255,255,0.07);
        border-right: 1px solid rgba(255,255,255,0.07);
      }

      .tw-matchstats-col--metrics > * + * { border-top: 1px solid rgba(255,255,255,0.07); }

      #matchStatsTeamA, #matchStatsTeamB {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        text-align: center;
        line-height: 1.1;
      }

      #matchStatsScoreline {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Bebas Neue", sans-serif;
        font-size: 30px;
        letter-spacing: 0.04em;
        color: #ffffff;
      }

      #matchStatsHoldsA, #matchStatsHoldsB,
      #matchStatsBreaksA, #matchStatsBreaksB,
      #matchStatsTurnoversA, #matchStatsTurnoversB,
      #matchStatsBlocksA, #matchStatsBlocksB {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Bebas Neue", sans-serif;
        font-size: 26px;
        letter-spacing: 0.04em;
      }

      .tw-matchstats-label {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.4);
        text-align: center;
        padding: 0 4px;
      }

      /* ── Team rosters banner ── */
      #teamRostersBanner {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) scale(0.97);
        opacity: 0;
        pointer-events: none;
        display: block;
        width: 900px;
        transition: opacity 0.18s ease, transform 0.18s ease;
        font-family: "Space Grotesk", sans-serif;
        z-index: 10;
      }

      #teamRostersBanner.is-active {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      .tw-roster-card {
        background: rgba(8,8,8,0.96);
        border: 1px solid rgba(255,255,255,0.07);
        box-shadow: 0 24px 60px rgba(0,0,0,0.6);
        overflow: hidden;
        max-height: 760px;
      }

      #teamRostersTitle {
        display: block;
        text-align: center;
        padding: 10px 16px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        background: rgba(0,0,0,0.5);
        color: rgba(255,255,255,0.4);
        border-bottom: 1px solid rgba(255,255,255,0.07);
      }

      .tw-roster-body {
        display: grid;
        grid-template-columns: repeat(2, minmax(0,1fr));
      }

      #teamRostersColumnA, #teamRostersColumnB {
        display: grid;
        grid-template-rows: minmax(48px,auto) minmax(0,1fr);
        background: var(--team-bg, #1f2933);
        color: var(--team-text, #ffffff);
        border-left: 4px solid var(--team-bg, transparent);
      }

      #teamRostersColumnB { border-left: 1px solid rgba(255,255,255,0.07); }

      #teamRostersTeamA, #teamRostersTeamB {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(255,255,255,0.07);
      }

      #teamRostersListA, #teamRostersListB {
        margin: 0;
        padding: 12px;
        list-style: none;
        display: grid;
        grid-template-columns: repeat(2, minmax(0,1fr));
        gap: 6px 12px;
        align-content: start;
      }

      .roster-banner-item {
        display: flex;
        justify-content: center;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .roster-banner-identity {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-width: 0;
      }

      .roster-banner-tag {
        min-width: 1.3rem;
        height: 1.3rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.4);
        background: rgba(255,255,255,0.1);
      }

      .roster-banner-tag--captain {
        background: var(--team-text, #ffffff);
        border-color: var(--team-text, #ffffff);
        color: var(--team-bg, #111111);
      }
    </style>
  </head>
  <body class="overlay-fixed">
    <div id="viewport">
      <div id="canvas">
        <div class="tw-root" id="overlayBar">
          <!-- Column headers -->
          <div class="tw-header">
            <div class="tw-header__cell"></div>
            <div class="tw-header__cell" style="justify-content:flex-start; padding-left:14px" id="eventName"></div>
            <div class="tw-header__cell" id="statusLabel">SCORE</div>
          </div>

          <!-- Row A -->
          <div class="tw-row is-serving" id="teamABox">
            <div class="tw-break-strip" id="breakChanceBannerA">BREAK<br>CHANCE</div>
            <div class="tw-serve">
              <span class="tw-serve__dot" id="serveDotA"></span>
            </div>
            <div class="tw-name" id="teamAName">Player A</div>
            <div class="tw-game" id="scoreA">0</div>
          </div>

          <!-- Row B -->
          <div class="tw-row" id="teamBBox">
            <div class="tw-break-strip" id="breakChanceBannerB">BREAK<br>CHANCE</div>
            <div class="tw-serve">
              <span class="tw-serve__dot" id="serveDotB"></span>
            </div>
            <div class="tw-name" id="teamBName">Player B</div>
            <div class="tw-game" id="scoreB">0</div>
          </div>
        </div>

        <!-- Required stubs -->
        <span id="matchClock" style="display:none">--:--</span>
        <div id="eventLogo" style="display:none"></div>
        <div id="eventLogoFallback" style="display:none"></div>        <div id="timeoutBannerA" style="display:none"></div>
        <div id="timeoutBannerB" style="display:none"></div>
        <div id="fieldCallBanner" style="display:none"></div>
        <div id="fieldCallBannerLabel" style="display:none"></div>
        <div id="matchEventBanner" style="display:none"></div>
        <div id="matchEventBannerLabel" style="display:none"></div>

        <!-- Player stats banner -->
        <div id="overlayBanner">
          <div class="tw-banner-team">
            <span id="bannerPlayerName">PLAYER NAME</span>
          </div>
          <div class="tw-banner-stats">
            <div class="tw-banner-stat">
              <span class="tw-banner-stat__label">GLS</span>
              <span class="tw-banner-stat__value" id="bannerStatGls">0</span>
            </div>
            <div class="tw-banner-stat">
              <span class="tw-banner-stat__label">AST</span>
              <span class="tw-banner-stat__value" id="bannerStatAst">0</span>
            </div>
            <div class="tw-banner-stat">
              <span class="tw-banner-stat__label">BLK</span>
              <span class="tw-banner-stat__value" id="bannerStatBlk">0</span>
            </div>
            <div class="tw-banner-stat">
              <span class="tw-banner-stat__label">TRN</span>
              <span class="tw-banner-stat__value" id="bannerStatTrn">0</span>
            </div>
          </div>
        </div>

        <!-- Match stats banner -->
        <div id="matchStatsBanner">
          <div class="tw-matchstats-card">
            <span id="matchStatsTitle">Match stats</span>
            <div class="tw-matchstats-body">
              <div class="tw-matchstats-col tw-matchstats-col--team" id="matchStatsColumnA">
                <div id="matchStatsTeamA">Team A</div>
                <div id="matchStatsHoldsA">--</div>
                <div id="matchStatsBreaksA">--</div>
                <div id="matchStatsTurnoversA">--</div>
                <div id="matchStatsBlocksA">--</div>
              </div>
              <div class="tw-matchstats-col tw-matchstats-col--metrics">
                <div id="matchStatsScoreline">0 - 0</div>
                <div class="tw-matchstats-label">Holds</div>
                <div class="tw-matchstats-label">Breaks</div>
                <div class="tw-matchstats-label">Turnovers</div>
                <div class="tw-matchstats-label">Blocks</div>
              </div>
              <div class="tw-matchstats-col tw-matchstats-col--team" id="matchStatsColumnB">
                <div id="matchStatsTeamB">Team B</div>
                <div id="matchStatsHoldsB">--</div>
                <div id="matchStatsBreaksB">--</div>
                <div id="matchStatsTurnoversB">--</div>
                <div id="matchStatsBlocksB">--</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Team rosters banner -->
        <div id="teamRostersBanner">
          <div class="tw-roster-card">
            <span id="teamRostersTitle">Team rosters</span>
            <div class="tw-roster-body">
              <div id="teamRostersColumnA">
                <div id="teamRostersTeamA">Team A</div>
                <ul id="teamRostersListA"></ul>
              </div>
              <div id="teamRostersColumnB">
                <div id="teamRostersTeamB">Team B</div>
                <ul id="teamRostersListB"></ul>
              </div>
            </div>
          </div>
        </div>

        <div class="meta" id="meta"></div>
      </div>
    </div>

    <script>
            function scaleCanvas() {
        const canvas = document.getElementById('canvas');
        if (!canvas) return;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const scale = Math.min(vw / 1920, vh / 1080);
        canvas.style.transform = `scale(${scale})`;
      }
      window.addEventListener('resize', scaleCanvas);
      scaleCanvas();
    </script>
    <script type="module" src="./src/overlay-entry.js"></script>
  </body>
</html>
